
name: React Application CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: react-production-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build and Deploy React
    runs-on: ubuntu-latest

    steps:
      # 1. Get source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 3. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Build React application
      - name: Build React
        run: npm run build

      # 5. Deploy build files to VPS
      - name: Deploy to VPS
        uses: easingthemes/ssh-deploy@v5.1.0
        with:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.VPS_HOST }}
          REMOTE_USER: ${{ secrets.VPS_USER }}
          REMOTE_PORT: ${{ secrets.VPS_PORT }}
          SOURCE: "dist/"
          TARGET: "/var/www/html/MantrixLab/dist/"
          ARGS: "-rlgoDzvc --delete"
